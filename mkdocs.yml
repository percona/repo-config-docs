# MkDocs configuration for builds with material theme

site_name: Percona Software Repositories 
site_description: How to install Percona software from repo.percona.com with percona-release, and the names of its repositories
site_author: Percona LLC
copyright: Percona LLC, &#169; 2026

site_url: 'https://docs.percona.com/percona-software-repositories/'
repo_name: /percona/repo-config-docs
repo_url: https://github.com/percona/repo-config-docs
edit_uri: edit/master/docs/

use_directory_urls: false


#Theme settings
theme:
  name: material
  custom_dir: _resource/overrides
  logo: assets/repo-mark.svg
  favicon: assets/repo-fav.svg
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    edit: material/file-edit-outline
    view: material/file-eye-outline
  
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Color theme set to Automatic. Click to change
    - media: "(prefers-color-scheme: light)"
      scheme: percona-light
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Color theme set to Light Mode. Click to change
    - media: "(prefers-color-scheme: dark)"
      scheme: percona-dark
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Color theme set to Dark Mode. Click to change

# Theme features

  features:
    - search.share
    - search.highlight
    - content.action.copy
#    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - toc.follow      
    - navigation.top
    - navigation.tracking 

#Styling
extra_css:
  - https://unicons.iconscout.com/release/v3.0.3/css/line.css
  - https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.4.0/css/font-awesome.min.css
  - css/nocopy.css
  - css/design.css
  - css/osano.css
  - css/repo.css
  - css/extra.css
  - css/rating.css
  - css/kapa.css

extra_javascript:
  - js/promptremover.js
  - js/consent.js
  - js/rating.js
  - js/kapa.js

markdown_extensions:
  abbr: {}
  attr_list: {}
  toc:
    permalink: True
    title: On this page
    toc_depth: 2
  admonition: {}
  footnotes: {}
  def_list: {} # https://michelf.ca/projects/php-markdown/extra/#def-list
  meta: {}
  md_in_html: {}
  smarty:
      {smart_angled_quotes: true}
  pymdownx.details: {}
  pymdownx.mark: {}
  pymdownx.smartsymbols: {}
  pymdownx.tabbed: 
      {alternate_style: true}
  pymdownx.tilde: {}
  pymdownx.superfences: 
    custom_fences:
      - name: mermaid
        class: mermaid
        format: !!python/name:pymdownx.superfences.fence_code_format
  pymdownx.highlight:
      use_pygments: true
  pymdownx.inlinehilite: {}
  pymdownx.snippets:  
    base_path: ["snippets"]
#    auto_append:
#      - services-banner.md
  pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - _resource/.icons
  
plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  - git-revision-date-localized:
      enable_creation_date: true
      enabled: !ENV [ENABLED_GIT_REVISION_DATE, True]
  - git-committers:
      enabled: !ENV [CI, false]
      repository: percona/repo-config-docs
      branch: "master" 
  - meta-descriptions:
      export_csv: false
      quiet: false
      enable_checks: false
      min_length: 50
      max_length: 160
# - bootstrap-tables
  - section-index # Adds links to nodes - comment out when creating PDF
#  - htmlproofer # Uncomment to check links - but extends build time significantly
  - macros:
        include_yaml:
          - 'variables.yml' # Use in markdown as '{{ VAR }}'
  # llms.txt, llms-full.txt and a .md copy of every page, for AI agents.
  # percona-llmstxt fills in the sections (from nav), base_url and the rest.
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: |
        Percona packages for apt and yum are installed from repo.percona.com.
        The percona-release tool turns its repositories on and off.

        Quick start:

        1. Install percona-release.
           Debian and Ubuntu: `curl -O https://repo.percona.com/apt/percona-release_latest.generic_all.deb`, then `sudo apt install gnupg2 lsb-release ./percona-release_latest.generic_all.deb` and `sudo apt update`.
           RHEL and derivatives: `sudo yum install -y https://repo.percona.com/yum/percona-release-latest.noarch.rpm`.
        2. Enable the repository of the product: `sudo percona-release setup <repository>`, for example `sudo percona-release setup ps-84-lts`.
           `setup` doesn't enable the Percona Server for MySQL 9.7 repository; use `sudo percona-release enable-only ps-97-lts release` instead.
           `setup` and `enable-only` turn off the other Percona repositories; `enable` adds one; `show` lists the enabled ones.
        3. Install the packages with apt or yum.

        A repository location is a repository plus a component: `release` (GA packages, the default), `testing` (release candidates) or `experimental` (alpha and beta builds), for example `sudo percona-release enable ps-97-lts testing`.

        Repository names:

        - Percona Server for MySQL: `ps-97-lts`, `ps-84-lts`, `ps-80`
        - Percona XtraDB Cluster: `pxc-97-lts`, `pxc-84-lts`, `pxc-80`
        - Percona XtraBackup: `pxb-97-lts`, `pxb-84-lts`, `pxb-80`
        - Percona Distribution for MySQL: `pdps-97-lts`, `pdpxc-97-lts`, `pdps-84-lts`, `pdpxc-84-lts`, `pdps-8.0`, `pdpxc-8.0`
        - Percona Server for MongoDB: `psmdb-83`, `psmdb-80`, `psmdb-70`, `psmdb-60`; Percona Distribution for MongoDB 8.0: `pdmdb-8.0`
        - Percona Backup for MongoDB: `pbm`
        - Percona Distribution for PostgreSQL: `ppg-18`, `ppg-17`, `ppg-16`, `ppg-15`, `ppg-14` (and minor versions such as `ppg-17.2`)
        - Tools: `pt` (Percona Toolkit), `pmm3-client`, `pmm2-client`, `proxysql`, `mysql-shell`, `sysbench`, `valkey`, `pcsm`

        Each page below is also available as markdown. For the documentation of
        all Percona products, see https://docs.percona.com/llms.txt.
      sections: {}
  - percona-llmstxt

extra:
  version:
    provider: mike
  analytics:
    provider: google
    property: G-J4J70BNH0G
  
nav:
